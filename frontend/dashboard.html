<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="dashboard-container">
        <h2>Dashboard</h2>
        <button onclick="logout()">Logout</button>

    <script src="js/tasks.js"></script>
</body>

</html>
